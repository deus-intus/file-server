# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Publish to npm
# DISABLED 2026-10-31 (Deus Intus estate audit, supabase->postgres migration prep).
# This workflow used to run on every push to `main` and `pver release` would publish
# the package @tscircuit/file-server to the public npm registry using secrets.NPM_TOKEN.
# This repo is a fork of tscircuit/file-server; it must not publish under the upstream scope.
# The trigger is now manual-only (workflow_dispatch). The file is NOT deleted.
# TO RESTORE: revert the commit that made this change, or put back:
#   on:
#     push:
#       branches:
#         - main
# Do not restore without founder approval and a renamed package / valid npm scope.
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm install -g pver
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: pver release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
